site_name: DFA Study Schema
site_url: https://oral-health-and-disease-ontologies.github.io/DFA-Study/
repo_url: https://github.com/oral-health-and-disease-ontologies/DFA-Study/
edit_uri:  '?query=root/DFA-Study/docs/'

plugins:
  - search
  - mermaid2:
      version: 10.9.0
  - redirects: # reference: https://github.com/mkdocs/mkdocs-redirects
      redirect_maps:
        'home.md': 'index.md'  # redirects "/home" to "/"
markdown_extensions:
  - admonition
  - tables
  - pymdownx.magiclink
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
nav:
  - ADA Oral Health and Well Being Schema: ada_ohwb/index.md
  - CareQuest SOHEA Schema: cq_sohea/index.md
  - COHRA1 Schema: cohra1/index.md
  - COHRA2 Schema: cohra2/index.md
  - DFA Study Schema: index.md
  - DFS Study Schema: dfs/index.md
  - COHRA2 Schema: cohra2/index.md
  - ADA Oral Health and Well Being Schema: ada_ohwb/index.md
  - CareQuest SOHEA Schema: cq_sohea/index.md
  - TIC Clinical Schema: tic_clinical/index.md
  - TIC Provider Schema: tic_provider/index.md
  - Modified Dental Anxiety Scale Schema: mdas/index.md
  - IDAF Schema: idaf/index.md
