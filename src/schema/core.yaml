id: https://w3id.org/OHD/DFA-study/core
name: core
title: DFA Study Schema
license: https://mit-license.org/
description: >-
  Core schema defining elements that are common across DFA-study schemas.  
  This schema is intended to be imported into other schemas.

prefixes:
  linkml: https://w3id.org/linkml/
  core: https://w3id.org/OHD/DFA-study/core/
  dcterms: http://purl.org/dc/terms/
  dwc: http://rs.tdwg.org/dwc/terms/

imports:
  - linkml:types
default_prefix: core

classes:
  Dataset:
    description: >-
      The dataset for the study
    tree_root: true
    slots:
      - records
  
  Record:
    description: >-
      A record in the dataset

slots:
  records:
    description: >-
      Slot for connecting the dataset to its records
    multivalued: true
    inlined_as_list: true
    range: Record

types:
  Score8to40:
    description: "Integer score between 8 and 40."
    base: integer
    minimum_value: 8
    maximum_value: 40

  Score0to40:
    description: "Integer score between 0 and 40."
    base: integer
    minimum_value: 0
    maximum_value: 40

  Score6to30:
    description: "Integer score between 6 and 30."
    base: integer
    minimum_value: 6
    maximum_value: 30
  
  Score0to30:
    description: "Integer score between 0 and 30."
    base: integer
    minimum_value: 0
    maximum_value: 30

  Score5to25:
    description: "Integer score between 5 and 25."
    base: integer
    minimum_value: 5
    maximum_value: 25

  Score0to25:
    description: "Integer score between 0 and 25."
    base: integer
    minimum_value: 0
    maximum_value: 25

  Score20to100:
    description: "Integer score between 20 and 100."
    base: integer
    minimum_value: 20
    maximum_value: 100

  Score0to100:
    description: "Integer score between 0 and 100."
    base: integer
    minimum_value: 0
    maximum_value: 100

  Score9to45:
    description: "Integer score between 9 and 45."
    base: integer
    minimum_value: 9
    maximum_value: 45

  Score3to15:
    description: "Integer score between 3 and 15."
    base: integer
    minimum_value: 3
    maximum_value: 15

  0to120:
    description: "Integer score between 0 and 120."
    base: integer
    minimum_value: 0
    maximum_value: 120

