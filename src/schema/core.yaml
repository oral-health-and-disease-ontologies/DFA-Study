id: https://w3id.org/OHD/DFA-study/core
name: core
title: DFA Study Schema
license: https://mit-license.org/
description: >-
  Core schema defining elements that are common across DFA-study schemas.  
  This schema is intended to be imported into other schemas.

prefixes:
  linkml: https://w3id.org/linkml/
  core: https://w3id.org/OHD/DFA-study/core/
  dcterms: http://purl.org/dc/terms/
  dwc: http://rs.tdwg.org/dwc/terms/

imports:
  - linkml:types
default_prefix: core

classes:
  Dataset:
    description: >-
      The dataset for the study
    tree_root: true
    slots:
      - records
  
  Record:
    description: >-
      A record in the dataset

slots:
  records:
    description: >-
      Slot for connecting the dataset to its records
    multivalued: true
    inlined_as_list: true
    range: Record

types:
  Score8to40:
    description: "Integer score between 8 and 40."
    base: integer
    minimum_value: 8
    maximum_value: 40

  Score0to40:
    description: "Integer score between 0 and 40."
    base: integer
    minimum_value: 0
    maximum_value: 40

  Score6to30:
    description: "Integer score between 6 and 30."
    base: integer
    minimum_value: 6
    maximum_value: 30
  
  Score0to30:
    description: "Integer score between 0 and 30."
    base: integer
    minimum_value: 0
    maximum_value: 30

  Score5to25:
    description: "Integer score between 5 and 25."
    base: integer
    minimum_value: 5
    maximum_value: 25

  Score0to25:
    description: "Integer score between 0 and 25."
    base: integer
    minimum_value: 0
    maximum_value: 25

  Score20to100:
    description: "Integer score between 20 and 100."
    base: integer
    minimum_value: 20
    maximum_value: 100

  Score0to100:
    description: "Integer score between 0 and 100."
    base: integer
    minimum_value: 0
    maximum_value: 100

  Score9to45:
    description: "Integer score between 9 and 45."
    base: integer
    minimum_value: 9
    maximum_value: 45

  Score3to15:
    description: "Integer score between 3 and 15."
    base: integer
    minimum_value: 3
    maximum_value: 15

enums:
  SexCOHRA:
    description: >-
      Enumeration for the sex of the participant.
    permissible_values:
      1:
        description: "Male"
        meaning: http://purl.obolibrary.org/obo/NCIT_C205465
      2:
        description: "Female"
        meaning: http://purl.obolibrary.org/obo/NCIT_C205464
      -9999:
        description: "Missing"
        meaning: http://purl.obolibrary.org/obo/NCIT_C54031
      -8888:
        description: "Don't Know"
        meaning: http://purl.obolibrary.org/obo/NCIT_C67142

  demRaceCOHRA:
    description: >-
      Enumeration of participant race/ethnicity in COHRA.
    permissible_values:
      1:
        description: "White"
        meaning: http://purl.obolibrary.org/obo/NCIT_C41261
      2:
        description: "African American"
        meaning: http://purl.obolibrary.org/obo/NCIT_C16352
      3:
        description: "Hawaiian/Pacific Islander"
        meaning: http://purl.obolibrary.org/obo/NCIT_C41219
      4:
        description: "Hispanic"
        meaning: http://purl.obolibrary.org/obo/NCIT_C17459
      5:
        description: "Native American/Alaskan Native"
        meaning: http://purl.obolibrary.org/obo/NCIT_C41259
      6:
        description: "Asian"
        meaning: http://purl.obolibrary.org/obo/NCIT_C41260
      7:
        description: "More than one race"
        meaning: http://purl.obolibrary.org/obo/NCIT_C67109
      999:
        description: "Other"
        meaning: http://purl.obolibrary.org/obo/NCIT_C104495
      -9999:
        description: "Missing"
        meaning: http://purl.obolibrary.org/obo/NCIT_C54031
      -8888:
        description: "Don't Know"
        meaning: http://purl.obolibrary.org/obo/NCIT_C67142
  
  NoYesCOHRA:
    description: >-
      Enumeration for yes/no responses in COHRA.
    permissible_values:
      0:
        description: "No"
        meaning: http://purl.obolibrary.org/obo/NCIT_C49487
      1:
        description: "Yes"
        meaning: http://purl.obolibrary.org/obo/NCIT_C49488
      -9999:
        description: "Missing"
        meaning: http://purl.obolibrary.org/obo/NCIT_C54031
      -5555:
        description: "Not part of protocol for this participant/age group"
      -8888:
        description: "Don't Know"
        meaning: http://purl.obolibrary.org/obo/NCIT_C67142

  LikertFearNH:
    description: >-
      Enumeration for respondant level of fear toward some situation, including an option for didn't happen because never happened to me.
    permissible_values:
      1: 
        description: "Not afraid at all"
      2:
        description: "A little afraid"
      3:
        description: "Somewhat afraid"
      4:
        description: "Pretty much afraid"
      5:
        description: "Very afraid"
      9:
        description: "I don't know, because this never happened to me."
      -5555:
        description: "Not Asked on Form at This Time"
      -9999:
        description: "Missing"
        meaning: http://purl.obolibrary.org/obo/NCIT_C54031
      -8888:
        description: "Don't Know"
        meaning: http://purl.obolibrary.org/obo/NCIT_C67142
  
  Frequency:
    description: >-
      Enumeration for the frequency with which an individual experiences some phenomenon.
    permissible_values:
      1: 
        description: "Never"
      2:
        description: "Once or twice"
      3:
        description: "A few times"
      4:
        description: "Often"
      5:
        description: "Nearly every time"
      -5555:
        description: "Not Asked on Form at This Time"
      -9999:
        description: "Missing"
        meaning: http://purl.obolibrary.org/obo/NCIT_C54031
      -8888:
        description: "Don't Know"
        meaning: http://purl.obolibrary.org/obo/NCIT_C67142

  FreqNH:
    description: >-
      Enumeration for the frequency with which an individual experiences some phenomenon, including an option for didn't happen because never happened to me.
    permissible_values:
      1: 
