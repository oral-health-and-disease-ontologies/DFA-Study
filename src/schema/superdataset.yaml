id: https://w3id.org/OHD/DFA-study/superdataset
name: superdataset
title: DFA Superdataset Schema
license: https://mit-license.org/

description: >-
  LinkML schema for defining data elements used in the DFS Superdataset.

prefixes:
  linkml: https://w3id.org/linkml/
  superdataset: https://w3id.org/OHD/DFA-study/superdataset/
  OHD:  http://purl.obolibrary.org/obo/OHD_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  dcterms: http://purl.org/dc/terms/
  dwc: http://rs.tdwg.org/dwc/terms/

imports:
  - linkml:types

default_prefix: superdataset

classes:
  Dataset:
    description: >-
      The Superdataset dataset.
    tree_root: true
    attributes:
      records:
        range: Record

  Record:
    description: >-
      A record in the Superdataset dataset.
    slots:
      - Participant_id
      - Participant_id_original
      - Last_Dental_Visit
      - Sex
      - Age
      - agegrp
      - Ethnicity
      - Race
      - dfs1
      - dfs2
      - dfs3
      - dfs4
      - dfs5
      - dfs6
      - dfs7
      - dfs8
      - dfs9
      - dfs10
      - dfs11
      - dfs12
      - dfs13
      - dfs14
      - dfs15
      - dfs16
      - dfs17
      - dfs18
      - dfs19
      - dfs20
      - idaf1a
      - idaf1b
      - idaf1c
      - idaf1d
      - idaf1e
      - idaf1f
      - idaf1g
      - idaf1h
      - idaf2a
      - idaf2b
      - idaf2c
      - idaf2d
      - idaf2e
      - idaf3a
      - idaf3b
      - idaf3c
      - idaf3d
      - idaf3e
      - idaf3f
      - idaf3g
      - idaf3h
      - idaf3i
      - idaf3j
      - mdas1
      - mdas2
      - mdas3
      - mdas4
      - mdas5
      - source
      - count_missing
      - dfs_flag
      - idaf_flag
      - mdas_flag
      - dfs_total
      - dfs_avoidance_fear
      - dfs_specific_stimuli_fear
      - dfs_physiological_arousal


slots:
  Participant_id:
    description: >-
      The participant's study ID.
    range: integer

  Participant_id_original:
    description: >-
      The participant's original study ID.
    range: string

  Last_Dental_Visit:
    description: >-
      How long has it been since you last visited a dentist or dental clinic for any reason?
    range: Years1to5

  Sex:
    description: >-
      The participant's sex
    range: SexSuperdataset

  Age:
    description: >-
      The participant's age in years (0–120). The value -9999 is used for missing values.
    range: integer
    any_of:
      - minimum_value: 0
        maximum_value: 120
      - equals_number: -9999
    
  agegrp:
    description: >-
      The age group of the participant.
    range: AgeGroup

  Ethnicity:
    description: >-
      The participant's ethnicity is Hispanic.
    range: NoYesMissing

  Race:
    description: >-
      The participant's race. The value -9999 is used for missing values.
    range: integer

  dfs1:
    description: >-
      Has fear of dental work ever caused you to put off making an appointment?
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000421 # DFS 01
    range: FrequencyMissing
    
  dfs2:
    description: >-
      Has fear of dental work ever caused you to cancel or not appear for an appointment?
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000422 # DFS 02
    range: FrequencyMissing
    
  dfs3:
    description: >-
      When having dental work done, my muscles become tense.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000423 # DFS 03
    range: LikertAmountMissing

  dfs4:
    description: >-
      When having dental work done, my breathing rate increases.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000424 # DFS 04
    range: LikertAmountMissing
    
  dfs5:
    description: >-
      When having dental work done, I perspire.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000426 # DFS 05
    range: LikertAmountMissing
    
  dfs6:
    description: >-
      When having dental work done, I feel nauseated and sick to my stomach.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000427 # DFS 06
    range: LikertAmountMissing
    
  dfs7:
    description: >-
      When having dental work done, my heart beats faster.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000428 # DFS 07
    range: LikertAmountMissing
    
  dfs8:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: Making an appointment for dentistry.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000429 # DFS 08
    range: LikertAmountMissing
    
  dfs9:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: Approching the dentist's office.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000430 # DFS 09
    range: LikertAmountMissing
    
  dfs10:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: Sitting in the waiting room.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000431 # DFS 10
    range: LikertAmountMissing
    
  dfs11:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: Being seated in the dental chair.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000432 # DFS 11
    range: LikertAmountMissing
    
  dfs12:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: The smell of the dentist's office.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000433 # DFS 12
    range: LikertAmountMissing
    
  dfs13:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: Seeing the dentist walk in.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000434 # DFS 13
    range: LikertAmountMissing
    
  dfs14:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: Seeing the anesthetic needle.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000435 # DFS 14
    range: LikertAmountMissing
    
  dfs15:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: Feeling the needle injected.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000436 # DFS 15
    range: LikertAmountMissing
    
  dfs16:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: Seeing the drill.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000437 # DFS 16
    range: LikertAmountMissing
    
  dfs17:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: Hearing the drill.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000438 # DFS 17
    range: LikertAmountMissing
    
  dfs18:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: Feeling the vibrations of the drill.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000439 # DFS 18
    range: LikertAmountMissing
    
  dfs19:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: Having your teeth cleaned.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000440 # DFS 19
    range: LikertAmountMissing
    
  dfs20:
    description: >-
      Please rate how much fear, anxiety, or unpleasantness each of these dental situations causes you: All things considered, how fearful are you of having dental work done?
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000441 # DFS 20
    range: LikertAmountMissing
    
  idaf1a:
    description: >-
      (1a) I feel anxious shortly before going to the dentist.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008055 # IDAF 1A
    range: LikertMissing
    
  idaf1b:
    description: >-
      (1b) I generally avoid going to the dentist because I find the experience unpleasant or distressing.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008056 # IDAF 1B
    range: LikertMissing
    
  idaf1c:
    description: >-
      (1c) I get nervous or edgy about upcoming dental visits.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008057 # IDAF 1C
    range: LikertMissing
    
  idaf1d:
    description: >-
      (1d) I think that something really bad would happen to me if I were to visit a dentist.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008058 # IDAF 1D
    range: LikertMissing
    
  idaf1e:
    description: >-
      (1e) I feel afraid or fearful when visiting the dentist.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008059 # IDAF 1E
    range: LikertMissing
    
  idaf1f:
    description: >-
      (1f) My heart beats faster when I go to the dentist.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008060 # IDAF 1F
    range: LikertMissing
    
  idaf1g:
    description: >-
      (1g) I delay making appointments to go to the dentist.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008061 # IDAF 1G
    range: LikertMissing
    
  idaf1h:
    description: >-
      (1h) I often think about all the things that might go wrong prior to going to the dentist.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008062 # IDAF 1H
    range: LikertMissing
    
  idaf2a:
    description: >-
      (2a) Going to the dentist is actively avoided or else endured with intense fear or anxiety
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008063 # IDAF 2A
    range: NoYesMissing
    
  idaf2b:
    description: >-
      (2b) My fear of going to the dentist has been present for at least 6 month
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008064 # IDAF 2B
    range: NoYesMissing
    
  idaf2c:
    description: >-
      (2c) My fear, anxiety or avoidance of going to the dentist significantly affects my life in some way (dental pain, avoiding eating some foods, embarrassed or self-conscious about appearance of teeth or mouth, etc.)
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008065 # IDAF 2C
    range: NoYesMissing
    
  idaf2d:
    description: >-
      (2d) I am afraid of going to the dentist because I am concerned I may have a panic attack (abrupt fear with sweating, pounding liteart, fear of dying or losing control, chest pain etc.)
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008066 # IDAF 2D
    range: NoYesMissing
    
  idaf2e:
    description: >-
      (2e) I am afraid of going to the dentist because I am generally highly self-conscious or concerned about being watched or judged in social situations.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008067 # IDAF 2E
    range: NoYesMissing
    
  idaf3a:
    description: >-
      (3a) Painful or uncomfortable procedures 
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008068 # IDAF 3A
    range: DegreeLikertMissing
    
  idaf3b:
    description: >-
      (3b)  Feeling embarrassed or ashamed  
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008069 # IDAF 3B
    range: DegreeLikertMissing
    
  idaf3c:
    description: >-
      (3c)  Not being in control of what is happening 
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008070 # IDAF 3C
    range: DegreeLikertMissing
    
  idaf3d:
    description: >-
      (3d)  Feeling sick, queasy or disgusted  
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008071 # IDAF 3D
    range: DegreeLikertMissing
    
  idaf3e:
    description: >-
      (3e)  Numbness caused by the anesthetic 
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008072 # IDAF 3E
    range: DegreeLikertMissing
    
  idaf3f:
    description: >-
      (3f)  Not knowing what the dentist is going to do  
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008073 # IDAF 3F
    range: DegreeLikertMissing
    
  idaf3g:
    description: >-
      (3g)  The cost of dental treatment 
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008074 # IDAF 3G
    range: DegreeLikertMissing
    
  idaf3h:
    description: >-
      (3h) Needles or injections 
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008075 # IDAF 3H
    range: DegreeLikertMissing
    
  idaf3i:
    description: >-
      (3i)  Gagging or choking  
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008076 # IDAF 3I
    range: DegreeLikertMissing
    
  idaf3j:
    description: >-
      (3j)  Having an unsympathetic or unkind dentist  
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0008077 # IDAF 3J
    range: DegreeLikertMissing
    
  mdas1:
    description: >-
      If you went to the dentist for treatment tomorrow [How would you feel in the following scenarios?]
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000446 # MDAS 1
    range: AnxietyMissing
    
  mdas2:
    description: >-
      If you were sitting in the waiting room (waiting for treatment) [How would you feel in the following scenarios?]
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000447 # MDAS 2
    range: AnxietyMissing
    
  mdas3:
    description: >-
      If you were about to have a tooth drilled [How would you feel in the following scenarios?]
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000448 # MDAS 3
    range: AnxietyMissing
    
  mdas4:
    description: >-
      If you were about to have your teeth scaled and polished [How would you feel in the following scenarios?]
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000449 # MDAS 4
    range: AnxietyMissing
    
  mdas5:
    description: >-
      If you were about to have a local anesthetic injection in your gum above an upper back tooth [How would you feel in the following scenarios?]
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000450 # MDAS 5
    range: AnxietyMissing
    
  source:
    description: >-
      The source of the data.
    range: StudySource
  
  count_missing:
    description: >-
      The count of missing values in the record.
    range: integer

  dfs_flag:
    description: >-
      The participant have dfs value or not.
    range: integer
  
  idaf_flag:
    description: >-
      The participant have idaf value or not.
    range: integer

  mdas_flag:
    description: >-
      The participant have mdas value or not.
    range: integer

  dfs_total:
    description: >-
      Sum all 20 dfs items.
    range: integer

  dfs_avoidance_fear:
    description: >-
      Sum dfs items 1, 2, 8, 9, 10, 11, 12, 13.
    range: integer

  dfs_specific_stimuli_fear:
    description: >-
      Sum dfs items 14, 15, 16, 17, 18, 19.
    range: integer

  dfs_physiological_arousal:
    description: >-
      Sum dfs items 3, 4, 5, 6, 7.
    range: integer

enums:
  Years1to5:
    description: >-
      An enumeration for a range of years.
    permissible_values:
      1:
        description: >-
          1 year or less
      2:
        description: >-
          1 to 2 years
      3:
        description: >-
          2 to 5 years
      4:
        description: >-
          5 or more years
      5:
        description: >-
          never
        meaning: NCIT:C70543
      -9999:
        description: >-
          Missing
        meaning: NCIT:C54031

  SexSuperdataset:
    description: >-
      An enumeration for the sex of the participant.
    permissible_values:
      1:
        description: >-
          Male
        meaning: NCIT:C205465
      2:
        description: >-
          Female
        meaning: NCIT:C205464
      3:
        description: >-
          Other
        meaning: NCIT:C104495
      -9999:
        description: >-
          Missing
        meaning: NCIT:C54031
    
  NoYesMissing:
    description: >-
      An enumeration for yes/no responses with a missing option.
    permissible_values:
      0:
        description: >-
          No
        meaning: NCIT:C49487
      1:
        description: >-
          Yes
        meaning: NCIT:C49488
      -9999:
        description: >-
          Missing
        meaning: NCIT:C54031

  NoYes:
    description: >-
      An enumeration for yes/no responses.
    permissible_values:
      0:
        description: >-
          No
        meaning: NCIT:C49487
      1:
        description: >-
          Yes
        meaning: NCIT:C49488

  ValueMissing:
    description: >-
      An enumeration for a missing value.
    permissible_values:
      -9999:
        description: >-
          Missing
        meaning: NCIT:C54031

  StudySource:
    description: >-
      An enumeration for the source of data.
    permissible_values:
      bph:
        description: >-
          Boston Public Housing
      bwhs:
        description: >-
          Black Women's Health Study
      cohra1:
        description: >-
          COHRA1
      cohra2:
        description: >-
          COHRA2
      f31:
        description: >-
          F31  
      randall:
        description: >-
          Randall  
      mdas:
        description: >-
          OHBSS mdas dataset
      sohea:
        description: >-
          CareQuest
      tic:
        description: >-
          Utah TIC
  
  AgeGroup:
    description: >-
      An enumeration for the age group of the participant.
    permissible_values:
      1:
        description: >-
          0-17 years
      2:
        description: >-
          18-34 years
      3:
        description: >-
          35-44 years
      4:
        description: >-
          45-54 years
      5:
        description: >-
          55-64 years
      6:
        description: >-
          65+ years
      -9999:
        description: >-
          Missing
        meaning: NCIT:C54031

  FrequencyMissing:
    description: >-
      An enumeration for a Likert scale of frequency with a missing option.
    permissible_values:
      1:
        description: >-
          Never
        meaning: NCIT:C70543
      2:
        description: >-
          Once or twice
      3:
        description: >-
          A few times
      4:
        description: >-
          Often
      5:
        description: >-
          Nearly every time
      -9999:
        description: >-
          Missing
        meaning: NCIT:C54031
      -9876:
        description: Not asked for in study

  LikertAmountMissing:
    description: >-
      An enumeration for a Likert scale of degree of fear with a missing option.
    permissible_values:
      1:
        description: >-
          Not at all
      2:
        description: >-
          A little
      3:
        description: >-
          Somewhat
      4:
        description: >-
          Much
      5:
        description: >-
          Very much
      -9999:
        description: >-
          Missing
        meaning: NCIT:C54031
      -9876:
        description: Not asked for in study

  LikertMissing:
    description: >-
      A standard 5-point Likert scale ranging from "Strongly Disagree" to "Strongly Agree", including an option for 'Missing'.
    permissible_values:
      1:
        description: Strongly Disagree
        meaning: NCIT:C104476
      2:
        description: Disagree
        meaning: NCIT:C104479
      3:
        description: Neither Agree nor Disagree
        meaning: NCIT:C103804
      4:
        description: Agree
        meaning: NCIT:C104478
      5:
        description: Strongly Agree
        meaning: NCIT:C104475
      -9999:
        description: Missing
        meaning: NCIT:C54031
      -9876:
        description: Not asked for in study

  DegreeLikertMissing:
    description: >-
      A standard 5-point frequency Likert scale ranging from "Not At All" to "Very Much", including an option for 'Missing'.
    permissible_values:
      1:
        description: Not At All
        meaning: NCIT:C91213
      2:
        description: A Little
        meaning: NCIT:C91214 
      3:
        description: Somewhat
        meaning: NCIT:C91215 
      4:
        description: Much
        meaning: NCIT:C126287
      5:
        description: Very Much
        meaning: NCIT:C91217 
      -9999:
        description: Missing
        meaning: NCIT:C54031
      -9876:
        description: Not asked for in study

  AnxietyMissing:
    description: >-
      Enumeration for answering whether an individual would feel anxious in some scenario.
    permissible_values:
      1: 
        description: Not anxious
        meaning: NCIT:C111675
      2:
        description: Slightly anxious
        meaning: NCIT:C120244
      3:
        description: Fairly anxious
        meaning: NCIT:C111676
      4:
        description: Very anxious
        meaning: NCIT:C120252
      5:
        description: Extremely anxious
      -9999:
        description: Missing
        meaning: NCIT:C54031
      -9876:
        description: Not asked for in study